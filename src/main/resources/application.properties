server.port=8081

# local h2 database, stored as a file
spring.datasource.url=jdbc:h2:file:./leaderboard-db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=leaderboard
spring.datasource.password=leaderboard
spring.web.resources.cache.period=0s

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
